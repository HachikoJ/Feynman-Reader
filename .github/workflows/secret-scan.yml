name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-build-security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Reject source maps and browser-side secrets
        shell: bash
        run: |
          if find out -type f -name '.DS_Store' -print -quit | grep -q .; then
            echo 'Finder metadata must not be published.'
            exit 1
          fi

          if find out -type f -name '*.map' -print -quit | grep -q .; then
            echo 'Production source maps must not be published.'
            exit 1
          fi

          forbidden='ghp_[A-Za-z0-9]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|NEXT_PUBLIC_ACTIVATION|NEXT_PUBLIC_[A-Z0-9_]*(SECRET|TOKEN|PASSWORD)|UNIVERSAL_CODE|generateActivationCode|feynman-(usage-count|activated|machine-id)'
          if grep -RInE --binary-files=without-match "$forbidden" out; then
            echo 'Production output contains a secret or client-side authorization marker.'
            exit 1
          fi

          if grep -RIl --include='*.js' 'sourceMappingURL\|webpack://\|src/components/.*\.tsx\|src/lib/.*\.ts' out | grep -q .; then
            echo 'Production JavaScript exposes source mapping metadata.'
            exit 1
          fi

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject high-severity production vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject client-side authorization secrets
        shell: bash
        run: |
          forbidden='NEXT_PUBLIC_ACTIVATION|NEXT_PUBLIC_[A-Z0-9_]*(SECRET|TOKEN|PASSWORD)|UNIVERSAL_CODE|generateActivationCode|feynman-(usage-count|activated|machine-id)'
          if git ls-files | grep -E '(^|/)\.DS_Store$'; then
            echo 'Finder metadata must not be committed.'
            exit 1
          fi

          if git grep -nE "$forbidden" -- src; then
            echo 'Authorization secrets or activation logic must not exist in the published source.'
            exit 1
          fi

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
