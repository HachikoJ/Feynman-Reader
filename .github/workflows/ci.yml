name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify release version
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict')
          const version = require('./package.json').version
          const lock = require('./package-lock.json')
          assert.equal(lock.version, version, 'Lockfile version must match package.json')
          assert.equal(lock.packages[''].version, version, 'Root package version must match')
          const ref = process.env.GITHUB_REF || ''
          if (ref.startsWith('refs/tags/')) {
            const tag = ref.slice('refs/tags/'.length)
            // `vX.Y.Z` tags are feature releases. `deploy-vX.Y.Z-<short sha>`
            // tags snapshot the commit that is actually served in production,
            // so they carry the version they were deployed from instead of
            // matching package.json exactly.
            const snapshot = /^deploy-v(\d+\.\d+\.\d+)-([0-9a-f]{7,40})$/.exec(tag)
            if (snapshot) {
              assert.equal(snapshot[1], version, 'Deployment snapshot tag must carry the package version')
              assert.ok(
                (process.env.GITHUB_SHA || '').startsWith(snapshot[2]),
                'Deployment snapshot tag must carry the commit it points at'
              )
            } else {
              assert.equal(tag, `v${version}`, 'Release tag must match package version')
            }
          }
          NODE

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Build production site
        run: npm run build

      - name: Check whitespace errors
        run: git diff --check
