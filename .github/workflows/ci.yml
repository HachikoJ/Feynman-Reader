name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify release version
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict')
          const version = require('./package.json').version
          const lock = require('./package-lock.json')
          assert.equal(lock.version, version, 'Lockfile version must match package.json')
          assert.equal(lock.packages[''].version, version, 'Root package version must match')
          const ref = process.env.GITHUB_REF || ''
          if (ref.startsWith('refs/tags/')) {
            assert.equal(ref.slice('refs/tags/'.length), `v${version}`, 'Release tag must match package version')
          }
          NODE

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Build production site
        run: npm run build

      - name: Check whitespace errors
        run: git diff --check
