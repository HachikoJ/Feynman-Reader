# Loaded by Nginx inside http {}. Values are empty for other virtual hosts,
# so the HTTPS server serving deline.top inherits the headers without changing
# unrelated sites on the same machine.

map $host $feynman_security_host {
    default 0;
    deline.top 1;
    www.deline.top 1;
}

map $feynman_security_host $feynman_csp {
    default "";
    1 "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.deepseek.com; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests";
}

map $feynman_security_host $feynman_frame_options {
    default "";
    1 "DENY";
}

map $feynman_security_host $feynman_content_type_options {
    default "";
    1 "nosniff";
}

map $feynman_security_host $feynman_referrer_policy {
    default "";
    1 "no-referrer";
}

map $feynman_security_host $feynman_permissions_policy {
    default "";
    1 "camera=(), geolocation=(), microphone=(), payment=(), usb=()";
}

map $feynman_security_host $feynman_opener_policy {
    default "";
    1 "same-origin";
}

map "$feynman_security_host:$scheme" $feynman_hsts {
    default "";
    "1:https" "max-age=31536000; includeSubDomains";
}

add_header Content-Security-Policy $feynman_csp always;
add_header X-Frame-Options $feynman_frame_options always;
add_header X-Content-Type-Options $feynman_content_type_options always;
add_header Referrer-Policy $feynman_referrer_policy always;
add_header Permissions-Policy $feynman_permissions_policy always;
add_header Cross-Origin-Opener-Policy $feynman_opener_policy always;
add_header Strict-Transport-Security $feynman_hsts always;
