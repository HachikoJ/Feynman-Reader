# 费曼读书助手：Next.js 服务与基础抗滥用配置
# 本文件由 Nginx 的 http {} 作用域 include，因此限流 zone 可在 server 外定义。

limit_req_zone $binary_remote_addr zone=feynman_per_ip:10m rate=20r/s;
limit_req_zone $server_name zone=feynman_global:1m rate=200r/s;
limit_conn_zone $binary_remote_addr zone=feynman_per_ip_conn:10m;
limit_conn_zone $server_name zone=feynman_site_conn:1m;

server {
    listen 80;
    listen [::]:80;
    server_name reader.deline.top;

    server_tokens off;

    # 站点与单 IP 双层保护。分布式流量仍需在 CDN/WAF 层拦截。
    limit_req zone=feynman_per_ip burst=60 nodelay;
    limit_req zone=feynman_global burst=400 nodelay;
    limit_req_status 429;
    limit_conn feynman_per_ip_conn 20;
    limit_conn feynman_site_conn 300;
    limit_conn_status 429;

    client_max_body_size 20m;
    client_body_timeout 30s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 120s;

    # Retired aliases must not reach the OAuth or payment configuration UI.
    location = /reader { return 410; }
    location ^~ /reader/ { return 410; }
    location = /feynmanreader { return 410; }
    location ^~ /feynmanreader/ { return 410; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /_next/static/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /sw.js {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # 阻断 dotfile、备份、日志和配置文件探测。
    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:env|git|svn|htaccess|htpasswd|log|bak|backup|sql|conf|ini|map)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/reader.deline.top.access.log combined buffer=64k flush=5s;
    error_log /var/log/nginx/reader.deline.top.error.log warn;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name reader.deline.top;

    access_log /var/log/nginx/reader.deline.top.access.log json_analytics;
    ssl_certificate /etc/nginx/ssl/deline.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/deline.top/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:reader_ssl:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/_acme-challenge;
        default_type text/plain;
        try_files $uri =404;
    }

    limit_req zone=feynman_per_ip burst=60 nodelay;
    limit_req zone=feynman_global burst=400 nodelay;
    limit_req_status 429;
    limit_conn feynman_per_ip_conn 20;
    limit_conn feynman_site_conn 300;
    limit_conn_status 429;

    client_max_body_size 20m;
    client_body_timeout 30s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 120s;

    location = /reader { return 410; }
    location ^~ /reader/ { return 410; }
    location = /feynmanreader { return 410; }
    location ^~ /feynmanreader/ { return 410; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /_next/static/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /sw.js {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:env|git|svn|htaccess|htpasswd|log|bak|backup|sql|conf|ini|map)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_log /var/log/nginx/reader.deline.top.error.log warn;
}
